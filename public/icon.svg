<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hex Shield -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#0284c7" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Cave Stalactites Silhouette in background -->
  <path d="M48 64 L96 160 L144 64 L200 190 L256 64 L312 180 L368 64 L416 150 L464 64 Z" fill="#0f172a" opacity="0.6"/>
  <path d="M48 448 L110 340 L160 448 L220 310 L256 448 L320 330 L380 448 L440 350 L464 448 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Speed Lines / Cave Depth Tunnel -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Cave Droid Fighter Ship (Centerpiece) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Thruster Plume -->
    <path d="M-22 45 L0 120 L22 45 L10 40 L0 50 L-10 40 Z" fill="url(#amberGlow)" opacity="0.95"/>
    <path d="M-10 45 L0 90 L10 45 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Wing Shadows -->
    <polygon points="0,-100 -95,45 -30,35 0,10 30,35 95,45" fill="#0f172a"/>

    <!-- Main Hull -->
    <polygon points="0,-115 -32,25 -20,42 0,32 20,42 32,25" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Swept Wings -->
    <polygon points="-24,5 -105,42 -75,48 -20,25" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="24,5 105,42 75,48 20,25" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>

    <!-- Wingtip Cannons -->
    <line x1="-105" y1="42" x2="-105" y2="-10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="42" x2="105" y2="-10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Cockpit Canopy Glass -->
    <polygon points="0,-75 -14,-15 0,5 14,-15" fill="url(#cyanGlow)" stroke="#e0f2fe" stroke-width="2"/>

    <!-- Nose Sensor Core -->
    <circle cx="0" cy="-45" r="4" fill="#ffffff"/>
  </g>

  <!-- Crosshair Ring & Reticle Marks -->
  <line x1="256" y1="180" x2="256" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <line x1="256" y1="332" x2="256" y2="352" stroke="#38bdf8" stroke-width="3"/>
  <line x1="180" y1="256" x2="160" y2="256" stroke="#38bdf8" stroke-width="3"/>
  <line x1="332" y1="256" x2="352" y2="256" stroke="#38bdf8" stroke-width="3"/>

  <!-- Corner Brackets -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#0284c7" stroke-width="4"/>
  <path d="M 452 100 L 452 60 L 412 60" fill="none" stroke="#0284c7" stroke-width="4"/>
  <path d="M 60 412 L 60 452 L 100 452" fill="none" stroke="#0284c7" stroke-width="4"/>
  <path d="M 452 412 L 452 452 L 412 452" fill="none" stroke="#0284c7" stroke-width="4"/>
</svg>
